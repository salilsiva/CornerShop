services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: cornershop-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - cornershop_sql_data:/var/opt/mssql
    healthcheck: 
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P $MSSQL_SA_PASSWORD -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  api:
    build:
      context: ..
      dockerfile: services/api-dotnet/CornerShopApi/Dockerfile
    container_name: cornershop-api
    depends_on:
      - sqlserver
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5093
      Frontend_BaseUrl: http://localhost:4200
      ConnectionStrings__DefaultConnection: ${DB_CONNECTION_STRING}
      Stripe__SecretKey: ${STRIPE_SECRET_KEY}
      Stripe__WebhookSecret: ${STRIPE_WEBHOOK_SECRET}
      Jwt__Key: ${JWT_KEY}
      Jwt__Issuer: CornerShopApi
      Jwt__Audience: CornerShopApiUsers
      Jwt__ExpiresMinutes: "120"
    ports:
      - "5093:5093"
  
  frontend:
    build:
      context: ../apps/web-store-angular
      dockerfile: Dockerfile
    container_name: cornershop-web
    depends_on:
      - api
    ports:
      - "4200:4200"
    environment:
      API_BAS_URL: "http://api/5093"
    volumes:
      - ../services/web-store-angular:/app
      - /app/node_modules  
volumes:
  cornershop_sql_data:
